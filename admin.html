<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スクリーンタイム獲得 (管理者)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const cfg = {
      apiKey: "AIzaSyBsFBb_dO-v9khjooHKO4qCeAw8VV5F8b4",
      authDomain: "screen-time-add.firebaseapp.com",
      projectId: "screen-time-add",
      storageBucket: "screen-time-add.firebasestorage.app",
      messagingSenderId: "645323942834",
      appId: "1:645323942834:web:5b14965ba05bea199452ab",
      measurementId: "G-DB6XHSNX3Q"
    };

    const defModes = [
      { id: "weekday", name: "平日", icon: "📅", bgType: "color", bgColor: "#f1f5f9", bgImage: "" },
      { id: "holiday", name: "休日・特別", icon: "☀️", bgType: "color", bgColor: "#fef3c7", bgImage: "" }
    ];

    const today = new Date().getDay();
    const initMode = (today === 0 || today === 6) ? "holiday" : "weekday";

    window.appState = {
      modes: JSON.parse(JSON.stringify(defModes)),
      items: [
        { id: "item_1", type: "item", text: "宿題を終わらせる", minutes: 30, completed: false, groupId: null, targetModes: ["weekday"] },
        { id: "item_2", type: "item", text: "部屋の片付け", minutes: 15, completed: false, groupId: null, targetModes: ["all"] },
        { id: "item_3", type: "item", text: "読書 20分", minutes: 20, completed: false, groupId: "group_1", targetModes: ["all"] },
        { id: "item_4", type: "item", text: "休日ドリル 2ページ", minutes: 30, completed: false, groupId: null, targetModes: ["holiday"] }
      ],
      groups: [{ id: "group_1", type: "group", name: "選択グループ 1" }],
      order: ["item_1", "item_2", "item_4", "group_1"],
      baseTime: "21:30",
      carryOverMinutes: 0,
      lastResetTimestamp: Date.now(),
      isAdmin: true,
      isPaused: false,
      currentMode: initMode
    };

    let db = null, docRef = null;
    try {
      const app = initializeApp(cfg);
      db = getFirestore(app);
      docRef = doc(db, "screentime", "sharedState");
    } catch(e) {}

    window.saveState = async function() {
      const p = {
        modes: window.appState.modes, items: window.appState.items, groups: window.appState.groups,
        order: window.appState.order, baseTime: window.appState.baseTime, carryOverMinutes: window.appState.carryOverMinutes,
        isPaused: !!window.appState.isPaused, currentMode: window.appState.currentMode || "weekday",
        lastResetTimestamp: window.appState.lastResetTimestamp, updatedAt: Date.now()
      };
      localStorage.setItem("screentime_backup", JSON.stringify(p));
      if (docRef) { try { await setDoc(docRef, p); } catch(err) {} }
    };

    function isItemInMode(item, mId) {
      if (window.appState.isAdmin) return true;
      const targets = item.targetModes || (item.dayType ? [item.dayType] : ["all"]);
      if (targets.includes("all") || targets.includes("both")) return true;
      return targets.includes(mId);
    }

    function checkReset() {
      const now = new Date(), last = new Date(window.appState.lastResetTimestamp || 0);
      const target = new Date(now);
      if (now.getHours() < 3) target.setDate(target.getDate() - 1);
      target.setHours(3,0,0,0);

      if (last.getTime() < target.getTime()) {
        let earned = 0, curM = window.appState.currentMode || "weekday";
        (window.appState.items || []).forEach(i => { if (i.completed && isItemInMode(i, curM)) earned += parseInt(i.minutes||0, 10); });
        let total = earned + parseInt(window.appState.carryOverMinutes||0, 10);

        const [sH, sM] = (window.appState.baseTime || "21:30").split(":").map(Number);
        let used = 0;
        if (now.getHours() > sH || (now.getHours() === sH && now.getMinutes() >= sM) || now.getHours() < 3) {
          let st = new Date(now);
          if (now.getHours() < 3) st.setDate(st.getDate() - 1);
          st.setHours(sH, sM, 0, 0);
          used = Math.floor((now.getTime() - st.getTime()) / 60000);
        }
        window.appState.carryOverMinutes = Math.max(0, total - used);
        window.appState.items.forEach(i => i.completed = false);
        window.appState.lastResetTimestamp = now.getTime();
        window.saveState();
      }
    }

    function loadLocal() {
      const local = localStorage.getItem("screentime_backup");
      if (local) {
        try {
          const d = JSON.parse(local);
          Object.assign(window.appState, d);
        } catch(e) {}
      }
    }

    if (docRef) {
      onSnapshot(docRef, (snap) => {
        if (snap.exists()) { Object.assign(window.appState, snap.data()); }
        else { window.saveState(); }
        checkReset();
        if (window.renderUI) window.renderUI();
      }, () => { loadLocal(); checkReset(); if (window.renderUI) window.renderUI(); });
    } else { loadLocal(); }
  </script>
  <style>.bg-custom-fitted { background-size: contain; background-position: center; background-repeat: repeat; background-attachment: fixed; background-color: #f1f5f9; }</style>
</head>
<body id="appBody" class="text-slate-800 min-h-screen pb-32 select-none transition-all duration-300 bg-custom-fitted">

  <header class="bg-gradient-to-r from-blue-600/90 to-indigo-600/90 backdrop-blur-md text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2"><span>⏱️</span> 管理者パネル</h1>
      <button onclick="openCustomBgModal()" class="text-xs bg-white/20 hover:bg-white/30 text-white px-2.5 py-1.5 rounded-full transition">🎨 背景変更</button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div id="modeTabsContainer" class="bg-slate-200/80 backdrop-blur-sm p-1 rounded-xl flex text-xs font-bold shadow-inner gap-1 overflow-x-auto"></div>

    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-5 shadow-sm border border-slate-200/80 text-center relative space-y-4">
      <div class="flex flex-col items-center gap-2 text-xs">
        <!-- 統一した見た目のインフォメーション行 -->
        <div class="text-center w-full">
          <p id="pauseNotice" class="text-indigo-600 font-bold hidden">※タイマー一時停止中</p>
          <p id="beforeStartNotice" class="text-indigo-600 font-bold">※本日 <span id="noticeStartTime">21:30</span> から時間の消費が開始されます</p>
        </div>
        <div class="w-full flex justify-end">
          <button id="pauseToggleBtn" onclick="togglePauseTimer()" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold px-4 py-1.5 rounded-full border border-amber-200 transition shadow-sm">⏸️ 一時停止</button>
        </div>
      </div>

      <div><span class="text-xs font-bold text-slate-400 tracking-wider uppercase">合計獲得スクリーンタイム</span></div>

      <div class="flex justify-center items-baseline flex-wrap gap-x-2 my-1">
        <div id="totalMinutesDisplayContainer" class="transition-opacity">
          <span id="totalMinutes" class="text-5xl font-extrabold text-indigo-800">0</span>
          <span class="text-lg font-bold text-slate-700 ml-0.5">分</span>
        </div>
        <span id="calculatedEndTime" class="text-sm font-semibold text-slate-500">（最大 21:30 まで）</span>
      </div>

      <!-- 統一した見た目に合わせた繰り越し表示 -->
      <p id="carryOverBadge" class="text-xs text-indigo-600 font-bold hidden">※前日からの繰り越し時間（<span id="carryOverValue">0</span>分）を含みます</p>

      <!-- 上下のパディングをさらに広げて適度な大きさに調整 -->
      <div class="p-5 bg-amber-50/90 rounded-xl border border-amber-200/80 shadow-inner flex items-center justify-center gap-2">
        <span class="text-lg">✨</span>
        <p class="text-xs font-bold text-amber-800">今すぐ寝ると明日 <span id="sleepRemainingMinutes" class="text-sm font-extrabold text-amber-600">0分</span> 貯金できます！</p>
      </div>

      <div class="pt-1">
        <p class="text-sm font-extrabold text-indigo-600 tracking-wide py-0.5">タスクを達成して時間をゲットしよう！</p>
      </div>
    </div>

    <div class="bg-slate-800/90 backdrop-blur-md text-white rounded-2xl p-4 shadow-lg space-y-4">
      <h2 class="text-sm font-bold flex items-center gap-1.5 text-amber-400 border-b border-slate-700 pb-2">⚙️ 管理者設定</h2>

      <div class="bg-slate-700/60 p-3 rounded-xl space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-amber-300">📁 モード管理</h3>
          <button onclick="addCustomMode()" class="text-[11px] bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-2 py-1 rounded">＋ 新規モード追加</button>
        </div>
        <div id="adminModeList" class="space-y-1.5"></div>
      </div>

      <div class="bg-slate-700/60 p-3 rounded-xl space-y-3">
        <h3 class="text-xs font-bold text-amber-300">⏱️ 時間・繰り越し設定</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-300 mb-1">カウント開始時間</label>
            <input type="time" id="baseTimeInput" onchange="updateBaseTime(this.value)" class="w-full text-slate-900 text-sm px-2.5 py-1.5 rounded-lg focus:outline-none font-bold bg-white">
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">現在の繰り越し(分)</label>
            <input type="number" id="carryOverInput" min="0" placeholder="0" onchange="updateCarryOver(this.value)" class="w-full text-slate-900 text-sm px-2.5 py-1.5 rounded-lg focus:outline-none font-bold bg-white">
          </div>
        </div>
      </div>

      <form onsubmit="addItem(event)" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-300 mb-1">項目名</label>
          <input type="text" id="newItemText" placeholder="例: 勉強 30分" required class="w-full text-slate-900 text-sm px-3 py-2 rounded-lg focus:outline-none">
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs text-slate-300 mb-1">獲得分</label>
            <input type="number" id="newItemMinutes" placeholder="15" required min="1" class="w-full text-slate-900 text-sm px-3 py-2 rounded-lg focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">モード</label>
            <select id="newItemModeSelect" class="w-full text-slate-900 text-sm px-2 py-2 rounded-lg focus:outline-none font-bold"></select>
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">グループ</label>
            <select id="newItemGroup" class="w-full text-slate-900 text-sm px-2 py-2 rounded-lg focus:outline-none text-slate-900"><option value="">(なし)</option></select>
          </div>
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 rounded-lg text-sm transition">＋ 項目を追加する</button>
      </form>

      <div class="pt-2 border-t border-slate-700">
        <button onclick="addGroup()" class="w-full bg-slate-700 hover:bg-slate-600 text-xs py-2 rounded-lg text-slate-200">＋ 新規選択グループ追加</button>
      </div>
    </div>

    <div id="unifiedListContainer" class="space-y-3 min-h-[100px]"></div>
  </main>

  <!-- 背景設定モーダル -->
  <div id="customBgModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4 text-slate-800">
      <h3 class="font-bold text-slate-800 text-base border-b pb-2 flex items-center gap-2"><span>🎨</span> <span id="modalModeTitle">モード</span> の背景</h3>
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">タイプ</label>
        <select id="userBgType" onchange="toggleUserBgInputs()" class="w-full border rounded-lg p-2 text-sm font-bold">
          <option value="default">🌐 デフォルト</option>
          <option value="color">🎨 単色カラー</option>
          <option value="file">📱 画像ファイル</option>
          <option value="image">🔗 画像URL</option>
        </select>
      </div>
      <div id="userBgColorContainer" class="hidden"><input type="color" id="userBgColor" value="#f1f5f9" class="h-10 w-full rounded border p-1 cursor-pointer"></div>
      <div id="userBgFileContainer" class="hidden">
        <input type="file" id="userBgFileInput" accept="image/*" onchange="handleImageFileSelect(event)" class="w-full border rounded-lg p-2 text-xs">
        <div id="filePreview" class="mt-2 text-center hidden"><img id="filePreviewImg" class="h-24 mx-auto rounded border object-cover"></div>
      </div>
      <div id="userBgImageContainer" class="hidden"><input type="url" id="userBgImage" placeholder="https://..." class="w-full border rounded-lg p-2 text-sm"></div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeCustomBgModal()" class="flex-1 bg-slate-200 text-slate-700 text-sm font-bold py-2 rounded-lg">キャンセル</button>
        <button onclick="saveUserBgSetting()" class="flex-1 bg-indigo-600 text-white text-sm font-bold py-2 rounded-lg">適用する</button>
      </div>
    </div>
  </div>

  <!-- タスク編集モーダル -->
  <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4 text-slate-800">
      <h3 class="font-bold text-slate-800 text-base border-b pb-2">項目の編集</h3>
      <input type="hidden" id="editItemId">
      <div><label class="block text-xs font-bold text-slate-500 mb-1">項目名</label><input type="text" id="editItemText" class="w-full border rounded-lg p-2 text-sm"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-xs font-bold text-slate-500 mb-1">獲得分</label><input type="number" id="editItemMinutes" min="1" class="w-full border rounded-lg p-2 text-sm"></div>
        <div><label class="block text-xs font-bold text-slate-500 mb-1">モード</label><select id="editItemModeSelect" class="w-full border rounded-lg p-2 text-sm font-bold"></select></div>
      </div>
      <div><label class="block text-xs font-bold text-slate-500 mb-1">グループ</label><select id="editItemGroup" class="w-full border rounded-lg p-2 text-sm"><option value="">(なし)</option></select></div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeEditModal()" class="flex-1 bg-slate-200 text-slate-700 text-sm font-bold py-2 rounded-lg">キャンセル</button>
        <button onclick="saveEditItem()" class="flex-1 bg-indigo-600 text-white text-sm font-bold py-2 rounded-lg">保存する</button>
      </div>
    </div>
  </div>

  <script>
    let mainSort = null, innerSorts = [], tempBase64 = "";
    setInterval(updateLive, 1000);

    function getBgMap() { try { return JSON.parse(localStorage.getItem("user_custom_bg_map") || "{}"); } catch(e){ return {}; } }

    window.openCustomBgModal = function() {
      const mode = window.appState.currentMode || "weekday";
      const mObj = (window.appState.modes || []).find(m => m.id === mode);
      document.getElementById("modalModeTitle").innerText = mObj ? `${mObj.icon||''} ${mObj.name}` : "モード";
      const bgMap = getBgMap(), bg = bgMap[mode] || { type: "default" };
      document.getElementById("userBgType").value = bg.type || "default";
      document.getElementById("userBgColor").value = bg.color || "#f1f5f9";
      document.getElementById("userBgImage").value = bg.image || "";
      tempBase64 = bg.fileData || "";
      if(tempBase64) { document.getElementById("filePreviewImg").src = tempBase64; document.getElementById("filePreview").classList.remove("hidden"); }
      else { document.getElementById("filePreview").classList.add("hidden"); }
      toggleUserBgInputs();
      document.getElementById("customBgModal").classList.remove("hidden");
      document.getElementById("customBgModal").classList.add("flex");
    };
    window.closeCustomBgModal = () => { document.getElementById("customBgModal").classList.add("hidden"); document.getElementById("customBgModal").classList.remove("flex"); };
    window.toggleUserBgInputs = () => {
      const t = document.getElementById("userBgType").value;
      document.getElementById("userBgColorContainer").classList.toggle("hidden", t !== "color");
      document.getElementById("userBgFileContainer").classList.toggle("hidden", t !== "file");
      document.getElementById("userBgImageContainer").classList.toggle("hidden", t !== "image");
    };
    window.handleImageFileSelect = (e) => {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let w = img.width, h = img.height, max = 1000;
          if(w > h && w > max) { h = Math.round(h * max / w); w = max; }
          else if(h >= w && h > max) { w = Math.round(w * max / h); h = max; }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          tempBase64 = canvas.toDataURL("image/jpeg", 0.7);
          document.getElementById("filePreviewImg").src = tempBase64;
          document.getElementById("filePreview").classList.remove("hidden");
        };
        img.src = evt.target.result;
      };
      r.readAsDataURL(f);
    };
    window.saveUserBgSetting = () => {
      try {
        const mode = window.appState.currentMode || "weekday";
        const map = getBgMap();
        map[mode] = { type: document.getElementById("userBgType").value, color: document.getElementById("userBgColor").value, image: document.getElementById("userBgImage").value.trim(), fileData: tempBase64 };
        localStorage.setItem("user_custom_bg_map", JSON.stringify(map));
        closeCustomBgModal(); applyBg();
      } catch(e) { alert("画像サイズが大きすぎます"); }
    };
    window.setMode = (id) => { window.appState.currentMode = id; window.renderUI(); window.saveState(); };
    window.togglePauseTimer = () => {
      window.appState.isPaused = !window.appState.isPaused;
      window.saveState(); updatePauseUI();
    };
    function updatePauseUI() {
      const btn = document.getElementById("pauseToggleBtn"), notice = document.getElementById("pauseNotice"), box = document.getElementById("totalMinutesDisplayContainer");
      if(!btn) return;
      if(window.appState.isPaused) {
        btn.innerHTML = "▶️ 再開"; btn.className = "text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-4 py-1.5 rounded-full border border-emerald-200 transition shadow-sm";
        notice.classList.remove("hidden"); box.classList.add("opacity-50", "animate-pulse");
      } else {
        btn.innerHTML = "⏸️ 一時停止"; btn.className = "text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold px-4 py-1.5 rounded-full border border-amber-200 transition shadow-sm";
        notice.classList.add("hidden"); box.classList.remove("opacity-50", "animate-pulse");
      }
    }
    function calcUsed() {
      if(window.appState.isPaused) return 0;
      const now = new Date(), [sH, sM] = (window.appState.baseTime || "21:30").split(":").map(Number);
      if(now.getHours() > sH || (now.getHours() === sH && now.getMinutes() >= sM) || now.getHours() < 3) {
        let st = new Date(now); if(now.getHours() < 3) st.setDate(st.getDate() - 1);
        st.setHours(sH, sM, 0, 0);
        return Math.floor((now.getTime() - st.getTime()) / 60000);
      }
      return 0;
    }
    function isMatch(item, mode) {
      if(window.appState.isAdmin) return true;
      const t = item.targetModes || (item.dayType ? [item.dayType] : ["all"]);
      return t.includes("all") || t.includes("both") || t.includes(mode);
    }
    function updateLive() {
      let earned = 0, mode = window.appState.currentMode || "weekday";
      (window.appState.items || []).forEach(i => { if(i.completed && isMatch(i, mode)) earned += parseInt(i.minutes||0, 10); });
      let total = earned + parseInt(window.appState.carryOverMinutes||0, 10), rem = Math.max(0, total - calcUsed());
      document.getElementById("totalMinutes").innerText = rem;
      document.getElementById("sleepRemainingMinutes").innerText = `${rem}分`;
      
      const now = new Date(), [sH, sM] = (window.appState.baseTime || "21:30").split(":").map(Number);
      const after = now.getHours() > sH || (now.getHours() === sH && now.getMinutes() >= sM) || now.getHours() < 3;
      const notice = document.getElementById("beforeStartNotice");
      document.getElementById("noticeStartTime").innerText = window.appState.baseTime || "21:30";
      if(!after && !window.appState.isPaused) notice.classList.remove("hidden"); else notice.classList.add("hidden");
      
      let endM = sH * 60 + sM + rem, eH = Math.floor(endM / 60) % 24, eMin = endM % 60;
      document.getElementById("calculatedEndTime").innerText = `（最大 ${String(eH).padStart(2,'0')}:${String(eMin).padStart(2,'0')} まで）`;
    }
    function applyBg() {
      const body = document.getElementById("appBody"), mode = window.appState.currentMode || "weekday";
      const bg = getBgMap()[mode] || { type: "default" };
      if(bg.type === "color" && bg.color) { body.style.backgroundImage = "none"; body.style.backgroundColor = bg.color; return; }
      if(bg.type === "file" && bg.fileData) { body.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.5),rgba(255,255,255,0.5)), url('${bg.fileData}')`; body.style.backgroundColor = ""; return; }
      if(bg.type === "image" && bg.image) { body.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.5),rgba(255,255,255,0.5)), url('${bg.image}')`; body.style.backgroundColor = ""; return; }
      const mObj = (window.appState.modes || []).find(m => m.id === mode);
      if(mObj && mObj.bgType === "image" && mObj.bgImage) { body.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.5),rgba(255,255,255,0.5)), url('${mObj.bgImage}')`; body.style.backgroundColor = ""; }
      else { body.style.backgroundImage = "none"; body.style.backgroundColor = (mObj && mObj.bgColor) ? mObj.bgColor : "#f1f5f9"; }
    }
    window.renderUI = function() {
      applyBg();
      const tabC = document.getElementById("modeTabsContainer"); tabC.innerHTML = "";
      (window.appState.modes || []).forEach(m => {
        const btn = document.createElement("button");
        btn.onclick = () => setMode(m.id);
        btn.className = `flex-1 py-2 px-3 rounded-lg transition-all text-center whitespace-nowrap ${m.id === window.appState.currentMode ? "bg-white text-indigo-700 font-extrabold shadow-sm" : "text-slate-600"}`;
        btn.innerText = `${m.icon||'📌'} ${m.name}`; tabC.appendChild(btn);
      });
      document.getElementById("baseTimeInput").value = window.appState.baseTime || "21:30";
      document.getElementById("carryOverInput").value = window.appState.carryOverMinutes || 0;
      renderAdminModes(); updateDropdowns();
      
      const carry = parseInt(window.appState.carryOverMinutes||0, 10), badge = document.getElementById("carryOverBadge");
      if(carry > 0) { badge.classList.remove("hidden"); document.getElementById("carryOverValue").innerText = carry; } else { badge.classList.add("hidden"); }
      updatePauseUI(); updateLive(); ensureOrder();

      const container = document.getElementById("unifiedListContainer"); container.innerHTML = "";
      const curMode = window.appState.currentMode || "weekday";
      (window.appState.order || []).forEach(id => {
        if(id.startsWith("group_")) {
          const g = (window.appState.groups || []).find(gr => gr.id === id);
          if(g) container.appendChild(createGroupCard(g, curMode));
        } else {
          const i = (window.appState.items || []).find(it => it.id === id && !it.groupId);
          if(i && isMatch(i, curMode)) container.appendChild(createItemCard(i));
        }
      });
      initSort();
    };
    function renderAdminModes() {
      const list = document.getElementById("adminModeList"); list.innerHTML = "";
      (window.appState.modes || []).forEach(m => {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between bg-slate-800/80 p-2 rounded-lg text-xs gap-2 font-bold";
        row.innerHTML = `<div><span>${m.icon||'📌'}</span> <span>${m.name}</span></div><div class="flex gap-1"><button onclick="editMode('${m.id}')" class="p-1">✏️</button><button onclick="deleteMode('${m.id}')" class="text-rose-400 p-1">🗑</button></div>`;
        list.appendChild(row);
      });
    }
    window.addCustomMode = () => {
      const name = prompt("モード名:"); if(!name?.trim()) return;
      const icon = prompt("アイコン:", "❄️") || "📌";
      window.appState.modes.push({ id: "mode_" + Date.now(), name: name.trim(), icon: icon.trim(), bgType: "color", bgColor: "#f1f5f9", bgImage: "" });
      window.renderUI(); window.saveState();
    };
    window.editMode = (id) => {
      const m = (window.appState.modes || []).find(x => x.id === id); if(!m) return;
      const name = prompt("モード名:", m.name); if(!name?.trim()) return;
      m.name = name.trim(); m.icon = prompt("アイコン:", m.icon || "📌") || "📌";
      window.renderUI(); window.saveState();
    };
    window.deleteMode = (id) => {
      if(window.appState.modes.length <= 1) { alert("最低1つ必要です"); return; }
      if(!confirm("削除しますか？")) return;
      window.appState.modes = window.appState.modes.filter(x => x.id !== id);
      if(window.appState.currentMode === id) window.appState.currentMode = window.appState.modes[0].id;
      window.renderUI(); window.saveState();
    };
    function ensureOrder() {
      const valid = [];
      (window.appState.order || []).forEach(id => {
        if(id.startsWith("group_")) { if((window.appState.groups||[]).some(g => g.id === id)) valid.push(id); }
        else { if((window.appState.items||[]).some(i => i.id === id && !i.groupId)) valid.push(id); }
      });
      (window.appState.items || []).forEach(i => { if(!i.groupId && !valid.includes(i.id)) valid.push(i.id); });
      (window.appState.groups || []).forEach(g => { if(!valid.includes(g.id)) valid.push(g.id); });
      window.appState.order = valid;
    }
    function createItemCard(item) {
      const card = document.createElement("div");
      card.dataset.id = item.id;
      card.className = `flex items-center justify-between p-3.5 rounded-xl shadow-sm border transition-all ${item.completed ? 'bg-indigo-50/90 border-indigo-200 ring-1 ring-indigo-300' : 'bg-white/90 border-slate-200 backdrop-blur-sm'}`;
      const tModes = item.targetModes || ["all"];
      let bHtml = tModes.includes("all") ? '<span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-1.5 py-0.5 rounded">共通</span>' : tModes.map(id => {
        const m = (window.appState.modes||[]).find(x => x.id === id); return `<span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-1.5 py-0.5 rounded mr-1">${m?m.name:id}</span>`;
      }).join("");

      card.innerHTML = `
        <div class="flex items-center gap-3 flex-1 min-w-0 mr-2 cursor-pointer" onclick="toggleCheck('${item.id}')">
          <input type="checkbox" ${item.completed?'checked':''} class="w-5 h-5 rounded border-slate-300 text-indigo-600 pointer-events-none flex-shrink-0">
          <div class="flex flex-col min-w-0"><span class="text-sm font-medium text-slate-800 break-words">${item.text}</span><div class="mt-0.5">${bHtml}</div></div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <span class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-sm">+${item.minutes}分</span>
          <button onclick="openEditModal('${item.id}')" class="p-1 text-slate-400 text-xs">✏️</button>
          <button onclick="deleteItem('${item.id}')" class="p-1 text-rose-400 text-xs">🗑</button>
          <span class="drag-handle cursor-grab text-slate-400 px-1 text-sm">☰</span>
        </div>`;
      return card;
    }
    function createGroupCard(group, mode) {
      const items = (window.appState.items || []).filter(i => i.groupId === group.id && isMatch(i, mode));
      const wrap = document.createElement("div"); wrap.dataset.id = group.id;
      wrap.className = "bg-slate-200/70 backdrop-blur-sm rounded-2xl p-3 border border-slate-300/70 space-y-2";
      wrap.innerHTML = `<div class="flex justify-between items-center px-1 text-slate-600 text-xs font-bold"><div class="flex items-center gap-1.5"><span class="drag-handle cursor-grab text-slate-400 text-sm font-extrabold pr-1">⠿</span><span>📌 どれか1つ選択</span></div><button onclick="deleteGroup('${group.id}')" class="text-rose-500 text-xs">グループ削除</button></div>`;
      const inner = document.createElement("div"); inner.className = "space-y-2 group-inner"; inner.dataset.groupId = group.id;
      items.forEach(i => inner.appendChild(createItemCard(i)));
      wrap.appendChild(inner); return wrap;
    }
    window.toggleCheck = (id) => {
      const i = (window.appState.items || []).find(x => x.id === id); if(!i) return;
      i.completed = !i.completed;
      if(i.completed && i.groupId) window.appState.items.forEach(x => { if(x.groupId === i.groupId && x.id !== id) x.completed = false; });
      window.renderUI(); window.saveState();
    };
    window.updateBaseTime = (v) => { if(!v) return; window.appState.baseTime = v; window.renderUI(); window.saveState(); };
    window.updateCarryOver = (v) => { window.appState.carryOverMinutes = Math.max(0, parseInt(v||0, 10)); window.renderUI(); window.saveState(); };
    window.addItem = (e) => {
      e.preventDefault();
      const text = document.getElementById("newItemText").value.trim(), min = parseInt(document.getElementById("newItemMinutes").value, 10) || 0;
      const mSel = document.getElementById("newItemModeSelect").value, gSel = document.getElementById("newItemGroup").value || null;
      const id = "item_" + Date.now();
      window.appState.items.push({ id, type: "item", text, minutes: min, completed: false, groupId: gSel, targetModes: mSel === "all" ? ["all"] : [mSel] });
      if(!gSel) window.appState.order.push(id);
      document.getElementById("newItemText").value = ""; document.getElementById("newItemMinutes").value = "";
      window.renderUI(); window.saveState();
    };
    window.openEditModal = (id) => {
      const i = (window.appState.items || []).find(x => x.id === id); if(!i) return;
      document.getElementById("editItemId").value = i.id;
      document.getElementById("editItemText").value = i.text;
      document.getElementById("editItemMinutes").value = i.minutes;
      const t = i.targetModes || ["all"];
      document.getElementById("editItemModeSelect").value = t.includes("all") ? "all" : t[0];
      document.getElementById("editItemGroup").value = i.groupId || "";
      document.getElementById("editModal").classList.remove("hidden");
      document.getElementById("editModal").classList.add("flex");
    };
    window.closeEditModal = () => { document.getElementById("editModal").classList.add("hidden"); document.getElementById("editModal").classList.remove("flex"); };
    window.saveEditItem = () => {
      const i = (window.appState.items || []).find(x => x.id === document.getElementById("editItemId").value); if(!i) return;
      const oldG = i.groupId, newG = document.getElementById("editItemGroup").value || null, mSel = document.getElementById("editItemModeSelect").value;
      i.text = document.getElementById("editItemText").value.trim();
      i.minutes = parseInt(document.getElementById("editItemMinutes").value, 10) || 0;
      i.targetModes = mSel === "all" ? ["all"] : [mSel];
      i.groupId = newG;
      if(oldG && !newG) window.appState.order.push(i.id);
      else if(!oldG && newG) window.appState.order = window.appState.order.filter(id => id !== i.id);
      closeEditModal(); window.renderUI(); window.saveState();
    };
    window.deleteItem = (id) => {
      if(!confirm("削除しますか？")) return;
      window.appState.items = window.appState.items.filter(x => x.id !== id);
      window.appState.order = window.appState.order.filter(x => x !== id);
      window.renderUI(); window.saveState();
    };
    window.addGroup = () => {
      const id = "group_" + Date.now();
      window.appState.groups.push({ id, type: "group", name: "選択グループ" });
      window.appState.order.push(id);
      window.renderUI(); window.saveState();
    };
    window.deleteGroup = (id) => {
      if(!confirm("グループを削除しますか？")) return;
      window.appState.groups = window.appState.groups.filter(g => g.id !== id);
      window.appState.order = window.appState.order.filter(x => x !== id);
      window.appState.items.forEach(i => { if(i.groupId === id) { i.groupId = null; window.appState.order.push(i.id); } });
      window.renderUI(); window.saveState();
    };
    function updateDropdowns() {
      [document.getElementById("newItemGroup"), document.getElementById("editItemGroup")].forEach(s => {
        if(!s) return; const cur = s.value; s.innerHTML = '<option value="">(なし)</option>';
        window.appState.groups.forEach((g, idx) => { const opt = document.createElement("option"); opt.value = g.id; opt.innerText = `選択グループ ${idx+1}`; s.appendChild(opt); });
        s.value = cur;
      });
      [document.getElementById("newItemModeSelect"), document.getElementById("editItemModeSelect")].forEach(s => {
        if(!s) return; const cur = s.value; s.innerHTML = '<option value="all">✨ 共通（全モード）</option>';
        window.appState.modes.forEach(m => { const opt = document.createElement("option"); opt.value = m.id; opt.innerText = `${m.icon||'📌'} ${m.name}`; s.appendChild(opt); });
        s.value = cur;
      });
    }
    function initSort() {
      if(mainSort) { mainSort.destroy(); mainSort = null; }
      innerSorts.forEach(s => s.destroy()); innerSorts = [];
      const mc = document.getElementById("unifiedListContainer");
      if(mc) {
        mainSort = new Sortable(mc, { handle: ".drag-handle", animation: 150, draggable: "> div", onEnd: () => {
          window.appState.order = Array.from(mc.children).map(c => c.dataset.id).filter(Boolean);
          window.saveState();
        }});
      }
      document.querySelectorAll(".group-inner").forEach(el => {
        innerSorts.push(new Sortable(el, { handle: ".drag-handle", animation: 150, onEnd: () => {
          const gId = el.dataset.groupId, other = window.appState.items.filter(i => i.groupId !== gId);
          const reordered = Array.from(el.querySelectorAll("[data-id]")).map(c => window.appState.items.find(i => i.id === c.dataset.id)).filter(Boolean);
          window.appState.items = [...other, ...reordered];
          window.saveState();
        }}));
      });
    }
    window.addEventListener("DOMContentLoaded", () => { window.renderUI(); });
  </script>
</body>
</html>
