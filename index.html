<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スクリーンタイム獲得</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      onSnapshot, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsFBb_dO-v9khjooHKO4qCeAw8VV5F8b4",
      authDomain: "screen-time-add.firebaseapp.com",
      projectId: "screen-time-add",
      storageBucket: "screen-time-add.firebasestorage.app",
      messagingSenderId: "645323942834",
      appId: "1:645323942834:web:5b14965ba05bea199452ab",
      measurementId: "G-DB6XHSNX3Q"
    };

    const defaultModes = [
      { id: "weekday", name: "平日", icon: "📅", bgType: "color", bgColor: "#f1f5f9", bgImage: "" },
      { id: "holiday", name: "休日・特別", icon: "☀️", bgType: "color", bgColor: "#fef3c7", bgImage: "" }
    ];

    const todayDay = new Date().getDay();
    const initialMode = (todayDay === 0 || todayDay === 6) ? "holiday" : "weekday";

    const defaultData = {
      modes: defaultModes,
      items: [
        { id: "item_1", type: "item", text: "宿題を終わらせる", minutes: 30, completed: false, groupId: null, targetModes: ["weekday"] },
        { id: "item_2", type: "item", text: "部屋の片付け", minutes: 15, completed: false, groupId: null, targetModes: ["all"] },
        { id: "item_3", type: "item", text: "読書 20分", minutes: 20, completed: false, groupId: "group_1", targetModes: ["all"] },
        { id: "item_4", type: "item", text: "休日ドリル 2ページ", minutes: 30, completed: false, groupId: null, targetModes: ["holiday"] }
      ],
      groups: [
        { id: "group_1", type: "group", name: "選択グループ 1" }
      ],
      order: ["item_1", "item_2", "item_4", "group_1"],
      baseTime: "21:30",
      carryOverMinutes: 0,
      isPaused: false,
      currentMode: initialMode,
      lastResetTimestamp: new Date().getTime()
    };

    window.appState = {
      modes: JSON.parse(JSON.stringify(defaultModes)),
      items: JSON.parse(JSON.stringify(defaultData.items)),
      groups: JSON.parse(JSON.stringify(defaultData.groups)),
      order: [...defaultData.order],
      baseTime: "21:30",
      carryOverMinutes: 0,
      lastResetTimestamp: new Date().getTime(),
      isPaused: false,
      currentMode: initialMode
    };

    let db = null;
    let docRef = null;

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      docRef = doc(db, "screentime", "sharedState");
    } catch(e) {
      console.warn("Firebase初期化スキップ、ローカル動作に切り替えます", e);
    }

    window.saveState = async function() {
      const payload = {
        modes: window.appState.modes,
        items: window.appState.items,
        groups: window.appState.groups,
        order: window.appState.order,
        baseTime: window.appState.baseTime,
        carryOverMinutes: window.appState.carryOverMinutes,
        isPaused: !!window.appState.isPaused,
        currentMode: window.appState.currentMode || "weekday",
        lastResetTimestamp: window.appState.lastResetTimestamp,
        updatedAt: new Date().getTime()
      };

      localStorage.setItem("screentime_backup", JSON.stringify(payload));

      if (docRef) {
        try {
          await setDoc(docRef, payload, { merge: true });
        } catch (err) {
          console.error("Firebaseへの保存エラー:", err);
        }
      }
    };

    function checkAndResetAt3AM() {
      const now = new Date();
      const lastReset = new Date(window.appState.lastResetTimestamp || 0);

      const target3AM = new Date(now);
      if (now.getHours() < 3) {
        target3AM.setDate(target3AM.getDate() - 1);
      }
      target3AM.setHours(3, 0, 0, 0);

      if (lastReset.getTime() < target3AM.getTime()) {
        let earnedMinutes = 0;
        const currentMode = window.appState.currentMode || "weekday";
        (window.appState.items || []).forEach(item => {
          if (item.completed && isItemInMode(item, currentMode)) {
            earnedMinutes += parseInt(item.minutes || 0, 10);
          }
        });
        const currentCarryOver = parseInt(window.appState.carryOverMinutes || 0, 10);
        const totalEarned = earnedMinutes + currentCarryOver;

        const baseTimeStr = window.appState.baseTime || "21:30";
        const parts = baseTimeStr.split(":");
        const startHour = parseInt(parts[0], 10) || 21;
        const startMinute = parseInt(parts[1], 10) || 30;

        let usedMinutes = 0;
        if (now.getHours() > startHour || (now.getHours() === startHour && now.getMinutes() >= startMinute) || now.getHours() < 3) {
          let startTime = new Date(now);
          if (now.getHours() < 3) {
            startTime.setDate(startTime.getDate() - 1);
          }
          startTime.setHours(startHour, startMinute, 0, 0);
          usedMinutes = Math.floor((now.getTime() - startTime.getTime()) / (1000 * 60));
        }

        const remainingMinutes = Math.max(0, totalEarned - usedMinutes);

        window.appState.carryOverMinutes = remainingMinutes;

        window.appState.items.forEach(item => {
          item.completed = false;
        });
        window.appState.lastResetTimestamp = now.getTime();
        window.saveState();
      }
    }

    function isItemInMode(item, modeId) {
      const targets = item.targetModes || (item.dayType ? [item.dayType] : ["all"]);
      if (targets.includes("all") || targets.includes("both")) return true;
      return targets.includes(modeId);
    }

    function loadLocalCache() {
      const local = localStorage.getItem("screentime_backup");
      if (local) {
        try {
          const data = JSON.parse(local);
          window.appState.modes = data.modes || defaultModes;
          window.appState.items = data.items || defaultData.items;
          window.appState.groups = data.groups || defaultData.groups;
          window.appState.order = data.order || defaultData.order;
          window.appState.baseTime = data.baseTime || "21:30";
          window.appState.carryOverMinutes = parseInt(data.carryOverMinutes || 0, 10);
          window.appState.isPaused = !!data.isPaused;
          window.appState.currentMode = data.currentMode || initialMode;
          window.appState.lastResetTimestamp = data.lastResetTimestamp || new Date().getTime();
        } catch(e) {}
      }
    }

    if (docRef) {
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          window.appState.modes = data.modes || defaultModes;
          window.appState.items = data.items || [];
          window.appState.groups = data.groups || [];
          window.appState.order = data.order || [];
          window.appState.baseTime = data.baseTime || "21:30";
          window.appState.carryOverMinutes = parseInt(data.carryOverMinutes || 0, 10);
          window.appState.isPaused = !!data.isPaused;
          window.appState.currentMode = data.currentMode || initialMode;
          window.appState.lastResetTimestamp = data.lastResetTimestamp || new Date().getTime();
        } else {
          window.saveState();
        }
        checkAndResetAt3AM();
        if (window.renderUI) window.renderUI();
      }, (error) => {
        console.warn("Firestoreリアルタイム接続エラー。ローカルキャッシュを使用します:", error);
        loadLocalCache();
        checkAndResetAt3AM();
        if (window.renderUI) window.renderUI();
      });
    } else {
      loadLocalCache();
    }
  </script>
  <style>
    .bg-custom-fitted {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body id="appBody" class="text-slate-800 min-h-screen pb-32 select-none transition-all duration-300 bg-custom-fitted">

  <header class="bg-gradient-to-r from-blue-600/90 to-indigo-600/90 backdrop-blur-md text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center relative">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>⏱️</span> スクリーンタイム獲得
      </h1>
      <button onclick="openCustomBgModal()" class="text-xs bg-white/20 hover:bg-white/30 text-white px-2.5 py-1 rounded-full transition flex items-center gap-1">
        🎨 このモードの背景変更
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- モード切り替えタブ -->
    <div id="modeTabsContainer" class="bg-slate-200/80 backdrop-blur-sm p-1 rounded-xl flex text-xs font-bold shadow-inner gap-1 overflow-x-auto"></div>

    <!-- 獲得時間サマリーカード -->
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-5 shadow-sm border border-slate-200/80 text-center relative">
      <div class="flex justify-between items-center mb-1">
        <span class="text-xs font-bold text-slate-400 tracking-wider uppercase">合計獲得スクリーンタイム</span>
        <div class="flex gap-1.5">
          <button id="pauseToggleBtn" onclick="togglePauseTimer()" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold px-2.5 py-1 rounded-full border border-amber-200 transition">
            ⏸️ 一時停止
          </button>
          <button onclick="openSleepCalcModal()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold px-2.5 py-1 rounded-full border border-indigo-200 transition">
            🌙 残時間を確認
          </button>
        </div>
      </div>

      <div class="flex justify-center items-baseline my-1 flex-wrap gap-x-2">
        <div id="totalMinutesDisplayContainer" class="transition-opacity">
          <span id="totalMinutes" class="text-5xl font-extrabold text-indigo-800">0</span>
          <span class="text-lg font-bold text-slate-700 ml-0.5">分</span>
        </div>
        <span id="calculatedEndTime" class="text-sm font-semibold text-slate-500">（最大 21:30 まで）</span>
      </div>
      <p id="carryOverBadge" class="text-xs text-indigo-600 font-medium hidden">
        ※前日からの繰り越し時間（<span id="carryOverValue">0</span>分）を含みます
      </p>
      <p id="pauseNotice" class="text-xs text-amber-600 font-bold mt-1 hidden">
        ※タイマー一時停止中（時間の消費が止まっています）
      </p>
      <p id="beforeStartNotice" class="text-xs text-indigo-600 font-bold mt-1 hidden">
        ※本日 <span id="noticeStartTime">21:30</span> から時間の消費が開始されます
      </p>
      <p id="defaultSummaryText" class="text-xs text-slate-400 mt-1">タスクを達成して時間をゲットしよう！</p>
    </div>

    <!-- リスト表示コンテナ -->
    <div id="unifiedListContainer" class="space-y-3 min-h-[100px]"></div>

  </main>

  <!-- 残り時間モーダル -->
  <div id="sleepCalcModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4 border border-indigo-100">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-indigo-900 text-base flex items-center gap-2">
          <span>🌙</span> 残り時間・繰り越し確認
        </h3>
        <button onclick="closeSleepCalcModal()" class="text-slate-400 hover:text-slate-600 p-1">✕</button>
      </div>

      <div class="space-y-3">
        <div class="p-4 bg-indigo-50 rounded-2xl border border-indigo-100 text-center">
          <div class="text-xs text-indigo-600 font-bold mb-1">今すぐ寝た場合に残るスクリーンタイム</div>
          <div id="sleepRemainingMinutes" class="text-4xl font-black text-indigo-800">0 分</div>
        </div>

        <div class="p-4 bg-amber-50 rounded-2xl border border-amber-200">
          <div class="text-xs text-amber-800 font-bold mb-1 flex items-center gap-1">
            <span>✨</span> 明日へそのまま繰り越せる時間
          </div>
          <p class="text-xs text-slate-700 leading-relaxed">
            今すぐスマホをやめて寝ると、明日 <span id="calculatedRolloverVal" class="font-bold text-amber-600 text-sm">0分</span> を貯金してそのまま繰り越せます！
          </p>
        </div>
      </div>

      <button onclick="closeSleepCalcModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">
        閉じる
      </button>
    </div>
  </script>

  <!-- 自家用背景設定モーダル -->
  <div id="customBgModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4 text-slate-800">
      <h3 class="font-bold text-slate-800 text-base border-b pb-2 flex items-center gap-2">
        <span>🎨</span> <span id="modalModeTitle">現在のモード</span> の背景設定
      </h3>
      
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">背景のタイプ</label>
        <select id="userBgType" onchange="toggleUserBgInputs()" class="w-full border rounded-lg p-2 text-sm font-bold">
          <option value="default">🌐 管理者設定（デフォルト）</option>
          <option value="color">🎨 好きな色に変更</option>
          <option value="file">📱 スマホの写真・画像を選ぶ</option>
          <option value="image">🔗 画像URLを指定</option>
        </select>
      </div>

      <div id="userBgColorContainer" class="hidden">
        <label class="block text-xs font-bold text-slate-500 mb-1">色を選択</label>
        <input type="color" id="userBgColor" value="#f1f5f9" class="h-10 w-full rounded cursor-pointer border p-1">
      </div>

      <div id="userBgFileContainer" class="hidden">
        <label class="block text-xs font-bold text-slate-500 mb-1">スマホの写真アルバムから選択</label>
        <input type="file" id="userBgFileInput" accept="image/*" onchange="handleImageFileSelect(event)" class="w-full border rounded-lg p-2 text-xs">
        <div id="filePreview" class="mt-2 text-center hidden">
          <img id="filePreviewImg" class="h-24 mx-auto rounded border shadow-sm object-cover">
        </div>
      </div>

      <div id="userBgImageContainer" class="hidden">
        <label class="block text-xs font-bold text-slate-500 mb-1">画像URL</label>
        <input type="url" id="userBgImage" placeholder="https://example.com/photo.jpg" class="w-full border rounded-lg p-2 text-sm">
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeCustomBgModal()" class="flex-1 bg-slate-200 text-slate-700 text-sm font-bold py-2 rounded-lg">キャンセル</button>
        <button onclick="saveUserBgSetting()" class="flex-1 bg-indigo-600 text-white text-sm font-bold py-2 rounded-lg">適用する</button>
      </div>
    </div>
  </div>

  <script>
    let tempBase64Image = "";

    setInterval(() => {
      updateLiveCalculations();
    }, 1000);

    function getUserBgMap() {
      try {
        return JSON.parse(localStorage.getItem("user_custom_bg_map") || "{}");
      } catch(e) {
        return {};
      }
    }

    window.openCustomBgModal = function() {
      const currentModeId = window.appState.currentMode || "weekday";
      const currentMode = (window.appState.modes || []).find(m => m.id === currentModeId);
      
      const titleEl = document.getElementById("modalModeTitle");
      if (titleEl) {
        titleEl.innerText = currentMode ? `${currentMode.icon || ''} ${currentMode.name}` : "モード";
      }

      const bgMap = getUserBgMap();
      const savedBg = bgMap[currentModeId] || { type: "default" };

      document.getElementById("userBgType").value = savedBg.type || "default";
      document.getElementById("userBgColor").value = savedBg.color || "#f1f5f9";
      document.getElementById("userBgImage").value = savedBg.image || "";
      tempBase64Image = savedBg.fileData || "";

      if (tempBase64Image) {
        document.getElementById("filePreviewImg").src = tempBase64Image;
        document.getElementById("filePreview").classList.remove("hidden");
      } else {
        document.getElementById("filePreview").classList.add("hidden");
      }

      toggleUserBgInputs();
      document.getElementById("customBgModal").classList.remove("hidden");
      document.getElementById("customBgModal").classList.add("flex");
    };

    window.closeCustomBgModal = function() {
      document.getElementById("customBgModal").classList.add("hidden");
      document.getElementById("customBgModal").classList.remove("flex");
    };

    window.toggleUserBgInputs = function() {
      const type = document.getElementById("userBgType").value;
      document.getElementById("userBgColorContainer").classList.toggle("hidden", type !== "color");
      document.getElementById("userBgFileContainer").classList.toggle("hidden", type !== "file");
      document.getElementById("userBgImageContainer").classList.toggle("hidden", type !== "image");
    };

    window.handleImageFileSelect = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const maxDimension = 1000;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDimension) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            }
          } else {
            if (height > maxDimension) {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          tempBase64Image = canvas.toDataURL("image/jpeg", 0.7);

          document.getElementById("filePreviewImg").src = tempBase64Image;
          document.getElementById("filePreview").classList.remove("hidden");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.saveUserBgSetting = function() {
      try {
        const currentModeId = window.appState.currentMode || "weekday";
        const type = document.getElementById("userBgType").value;
        const color = document.getElementById("userBgColor").value;
        const image = document.getElementById("userBgImage").value.trim();

        const bgMap = getUserBgMap();
        bgMap[currentModeId] = {
          type,
          color,
          image,
          fileData: tempBase64Image
        };

        localStorage.setItem("user_custom_bg_map", JSON.stringify(bgMap));

        closeCustomBgModal();
        applyBodyBackground();
      } catch (e) {
        alert("画像のサイズが大きいため保存できませんでした。別の画像を選択してください。");
      }
    };

    window.setMode = function(modeId) {
      window.appState.currentMode = modeId;
      window.renderUI();
      if (window.saveState) window.saveState();
    };

    window.togglePauseTimer = function() {
      const isCurrentlyPaused = !!window.appState.isPaused;
      const message = isCurrentlyPaused 
        ? "タイマーの消費を「再開」しますか？" 
        : "タイマーの消費を「一時停止」しますか？";

      if (confirm(message)) {
        window.appState.isPaused = !isCurrentlyPaused;
        if (window.saveState) window.saveState();
        updatePauseUI();
      }
    };

    function updatePauseUI() {
      const pauseBtn = document.getElementById("pauseToggleBtn");
      const pauseNotice = document.getElementById("pauseNotice");
      const defaultText = document.getElementById("defaultSummaryText");
      const displayContainer = document.getElementById("totalMinutesDisplayContainer");

      if (!pauseBtn || !pauseNotice || !defaultText || !displayContainer) return;

      if (window.appState.isPaused) {
        pauseBtn.innerHTML = "▶️ 再開";
        pauseBtn.className = "text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-full border border-emerald-200 transition";
        pauseNotice.classList.remove("hidden");
        defaultText.classList.add("hidden");
        displayContainer.classList.add
